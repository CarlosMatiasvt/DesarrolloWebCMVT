<h2>Nuevo producto</h2>
<div id="mensajes-form"></div>

<form id="form-producto" novalidate>
    <div class="fila">
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej.: Alitas BBQ">
            <div class="error-campo" id="err-nombre"></div>
        </div>
        <div class="campo">
            <label for="categoria_id">Categoría</label>
            <select id="categoria_id" name="categoria_id">
                <option value="">-- Seleccione --</option>
            </select>
            <div class="error-campo" id="err-categoria"></div>
        </div>
        <div class="campo">
            <label for="precio">Precio (Bs)</label>
            <input type="number" id="precio" name="precio" step="0.50" min="0" placeholder="0.00">
            <div class="error-campo" id="err-precio"></div>
        </div>
    </div>

    <div class="campo">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3" placeholder="Ingredientes o detalles del producto..."></textarea>
    </div>

    <div class="fila">
        <div class="campo">
            <label for="imagen">Fotografía (jpg, png o webp, máx. 2 MB)</label>
            <input type="file" id="imagen" name="imagen" accept=".jpg,.jpeg,.png,.webp">
        </div>
        <div class="campo">
            <label for="disponible">Disponible</label>
            <select id="disponible" name="disponible">
                <option value="1" selected>Sí</option>
                <option value="0">No (Agotado)</option>
            </select>
        </div>
    </div>

    <button type="submit" id="btn-guardar" class="boton boton-ok">Guardar producto</button>
</form>
